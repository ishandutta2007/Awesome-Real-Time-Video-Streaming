<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="wave-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".2"/><stop offset="50%" stop-color="#6366f1" stop-opacity=".4"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{transform:scale(1);opacity:.3}50%{transform:scale(1.08);opacity:.7}}@keyframes waveShift{0%{transform:translateY(0) scaleY(1)}}@keyframes grow{0%{transform:scaleY(.3)}}.pulse-circle{animation:pulse 3s infinite ease-in-out}.wave-path{animation:waveShift 6s infinite alternate ease-in-out}.signal-bar{animation:grow 1.5s infinite alternate ease-in-out}</style></defs><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g opacity=".4"><path fill="url(#wave-grad)" d="M 0,220 Q 300,120 600,200 T 1200,150 L 1200,300 L 0,300 Z" class="wave-path"/><circle cx="200" cy="150" r="140" fill="none" stroke="#38bdf8" stroke-width="1" class="pulse-circle" opacity=".2" style="transform-origin:200px 150px"/><circle cx="1000" cy="150" r="180" fill="none" stroke="#a855f7" stroke-width="1" class="pulse-circle" opacity=".2" style="transform-origin:1000px 150px;animation-delay:1s"/><g opacity=".25" transform="translate(1020, 70)"><rect width="8" height="60" x="0" y="20" fill="#38bdf8" class="signal-bar" rx="4" style="transform-o