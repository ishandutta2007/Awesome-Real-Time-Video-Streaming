<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .wave-path {
        animation: waveShift 6s infinite alternate ease-in-out;
      }
      .signal-bar {
        animation: grow 1.5s infinite alternate ease-in-out;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.08); opacity: 0.7; }
        100% { transform: scale(1); opacity: 0.3; }
      }
      @keyframes waveShift {
        0% { transform: translateY(0px) scaleY(1); }
        100% { transform: translateY(-10px) scaleY(1.15); }
      }
      @keyframes grow {
        0% { transform: scaleY(0.3); }
        100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Animated Elements (Low Opacity, strictly behind text) -->
  <g opacity="0.4">
    <!-- Animated Signal Waves in background -->
    <path class="wave-path" d="M 0,220 Q 300,120 600,200 T 1200,150 L 1200,300 L 0,300 Z" fill="url(#wave-grad)"/>
    
    <!-- Glowing background orbits -->
    <circle cx="200" cy="150" r="140" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" class="pulse-circle" style="transform-origin: 200px 150px;"/>
    <circle cx="1000" cy="150" r="180" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.2" class="pulse-circle" style="transform-origin: 1000px 150px; animation-delay: 1s;"/>
    
    <!-- Equalizer Bars Background Graphic -->
    <g transform="translate(1020, 70)" opacity="0.25">
      <rect x="0" y="20" width="8" height="60" rx="4" fill="#38bdf8" class="signal-bar" style="transform-origin: bottom; animation-delay: 0.1s;"/>
      <rect x="16" y="0" width="8" height="80" rx="4" fill="#818cf8" class="signal-bar" style="transform-origin: bottom; animation-delay: 0.3s;"/>
      <rect x="32" y="35" width="8" height="45" rx="4" fill="#c084fc" class="signal-bar" style="transform-origin: bottom; animation-delay: 0.5s;"/>
      <rect x="48" y="10" width="8" height="70" rx="4" fill="#38bdf8" class="signal-bar" style="transform-origin: bottom; animation-delay: 0.2s;"/>
      <rect x="64" y="25" width="8" height="55" rx="4" fill="#818cf8" class="signal-bar" style="transform-origin: bottom; animation-delay: 0.4s;"/>
    </g>
  </g>

  <!-- Live Pulse Indicator Badge -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">LIVE NOW</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Title -->
    <text x="0" y="135" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Real-Time Video Streaming
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="178" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">
      Curated Ecosystem of SaaS Platforms, WebRTC Media Servers &amp; Live Streaming Infrastructure
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="-240" y="0" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="-170" y="19" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">⚡ Sub-Second WebRTC</text>
      
      <!-- Pill 2 -->
      <rect x="-85" y="0" width="170" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="19" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="600">🎥 Open-Source Media Servers</text>

      <!-- Pill 3 -->
      <rect x="100" y="0" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="170" y="19" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600">📡 Scalable HLS / SRT</text>
    </g>
  </g>
</svg>
